# Overlay for the SC<->UT cross-plugin interoperability harness
# (tests/integration/Interop). Mounts the sibling universal-telegram
# checkout (real source, real branch, not a fixture) into the same
# container that already runs the universal-support-chat integration
# suite, so both plugins' real code — including Universal Telegram's real,
# merged `LegacyExportServiceV1` (ADR-0008) — can be loaded into one
# disposable WordPress test install. Merge with the base compose file:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.interop.yml run --rm php ...
#
# UNIVERSAL_TELEGRAM_HOST_PATH overrides the sibling checkout path if it
# ever needs to move; defaults to this VPS's fixed dev layout.
services:
  php:
    volumes:
      - ${UNIVERSAL_TELEGRAM_HOST_PATH:-/opt/biopentra/dev/universal-telegram}:/universal-telegram
