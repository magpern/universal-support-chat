name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: PHPCS
        run: bin/docker/phpcs.sh

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: PHPStan
        run: bin/docker/phpstan.sh

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Unit tests (PHP ${{ matrix.php-version }})
        run: bin/docker/test-unit.sh --php-version=${{ matrix.php-version }}

  integration-wp-only-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Integration tests (WordPress 6.9, PHP 8.1)
        run: bin/docker/test-integration-wp-only.sh --wp-version=6.9 --php-version=8.1

  integration-wp-only-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Integration tests (WordPress 7.1, PHP 8.3)
        run: bin/docker/test-integration-wp-only.sh --wp-version=7.1 --php-version=8.3

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Check documentation links
        run: bin/docker/composer.sh run-script check-doc-links

  package:
    name: Release package (build validation, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the release package (Docker php service)
        run: bin/docker/build-release-package.sh
      - name: Inspect the artifact
        run: |
          set -euo pipefail
          zip="$(ls dist/universal-support-chat-*.zip)"
          sum="$(ls dist/universal-support-chat-*.zip.sha256)"
          test -s "$zip"
          test -s "$sum"
          echo "== ZIP contents =="
          unzip -l "$zip"
          ( cd dist && sha256sum -c "$(basename "$sum")" )
          names="$(unzip -Z1 "$zip")"
          test "$(printf '%s\n' "$names" | cut -d/ -f1 | sort -u)" = "universal-support-chat"
          printf '%s\n' "$names" | grep -qx 'universal-support-chat/universal-support-chat.php'
          printf '%s\n' "$names" | grep -qx 'universal-support-chat/vendor/autoload.php'
          ! printf '%s\n' "$names" | grep -qE '/(\.git|\.github|\.claude|tests|docs|docker|bin|scripts)/'

  interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp-version: '6.9'
            php-version: '8.1'
          - wp-version: '7.1'
            php-version: '8.3'
    steps:
      - name: Checkout universal-support-chat
        uses: actions/checkout@v7
      # Pinned to Universal Telegram `main` at the merged ADR-0045 commit
      # (PR #64) — interactive-priority transport, the counterpart this SC
      # feature needs. Never a floating branch; bump deliberately alongside
      # SC-side changes.
      - name: Checkout universal-telegram (pinned)
        uses: actions/checkout@v7
        with:
          repository: magpern/universal-telegram
          ref: 9b4a6ef2bfc56b4bb514567c797d41c8a285727a
          path: universal-telegram-sibling
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Cross-plugin interop suite (real dual-plugin, real Contract v1)
        env:
          UNIVERSAL_TELEGRAM_HOST_PATH: ${{ github.workspace }}/universal-telegram-sibling
        run: bin/docker/test-integration-interop.sh --wp-version=${{ matrix.wp-version }} --php-version=${{ matrix.php-version }}
